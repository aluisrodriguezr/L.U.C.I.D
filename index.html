<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laser-Ultraviolet Cyanobacteria Identification and Detection System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase (Classic SDK v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Styles -->
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <!-- Header -->
    <div class="dashboard-header">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1><i class="fas"></i>Laser‑Ultraviolet Cyanobacteria Identification and Detection System</h1>
          <p class="mb-0">Real‑time cyanobacteria detection and water quality analysis</p>
        </div>
        <div class="col-md-4 text-end">
          <span class="badge bg-success" id="connection-status">
            <i class="fas fa-circle"></i> Connected to Device
          </span>
        </div>
      </div>
    </div>

    <!-- Real‑time Sensor Cards -->
    <div class="row mb-4" id="sensor-cards"></div>

    <!-- Charts -->
    <div class="row">
      <div class="col-lg-8">
        <div class="chart-container">
          <h5>Wavelength Intensity Mapping</h5>
          <canvas id="spectrum-chart"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="chart-container">
          <h5>Photodiode Readings</h5>
          <canvas id="photodiode-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Controls & History -->
    <div class="row mt-4">
      <div class="col-md-5">
        <div class="control-panel" id="control-panel"></div>
      </div>
      <div class="col-md-7">
        <div class="historical-container">
          <h5>Historical Data</h5>
          <div class="mb-3 d-flex">
            <input type="text" class="form-control me-2" id="history-label" placeholder="Enter sample label" />
            <button class="btn btn-sm btn-secondary" id="load-history-btn">Load Sample</button>
          </div>
          <canvas id="history-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- System Log -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="control-panel" id="data-management">
          <h5>System Log</h5>
          <div id="log-output" class="log-output"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="js/config.js"></script>     
  <script src="js/charts.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/ui.js"></script>          
  <script src="js/main.js"></script>        
</body>
</html>
